apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: crossplane-kubernetes-provider
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.4'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1'
  description: Installs provider-kubernetes plus its injected-identity ProviderConfig
    and RBAC binding in the target Crossplane cluster.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # crossplane-kubernetes-provider
    Installs provider-kubernetes plus its injected-identity ProviderConfig and RBAC binding in the target Crossplane cluster.
  repository: ghcr.io/hops-ops/crossplane-kubernetes-provider
  source: github.com/hops-ops/crossplane-kubernetes-provider
